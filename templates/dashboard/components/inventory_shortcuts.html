<section class="inventory-shortcuts" aria-label="Inventory navigation">
  <p class="inventory-shortcuts__home" aria-label="Inventory page context">
    <span aria-hidden="true">&#9638;</span><strong>Inventory</strong>
  </p>
  <nav class="inventory-shortcuts__links" aria-label="Inventory sections">
    <div class="inventory-shortcuts__row">
      <a href="{% url 'dashboard:inventory' %}"{% if request.resolver_match.url_name == 'inventory' %} class="is-active" aria-current="page"{% endif %}><span aria-hidden="true">&#128202;</span>Overview</a>
      <a href="{% url 'dashboard:inventory_stock' %}"{% if request.resolver_match.url_name == 'inventory_stock' %} class="is-active" aria-current="page"{% endif %}><span aria-hidden="true">&#128230;</span>On-Hand Stock</a>
      <a href="{% url 'dashboard:inventory_receipt_create' %}"{% if request.resolver_match.url_name == 'inventory_receipt_create' %} class="is-active" aria-current="page"{% endif %}><span aria-hidden="true">&#128666;</span>Acquire Stock</a>
      <a href="{% url 'dashboard:inventory_history' %}"{% if request.resolver_match.url_name == 'inventory_history' %} class="is-active" aria-current="page"{% endif %}><span aria-hidden="true">&#128220;</span>History</a>
    </div>
  </nav>
