<article class="staff-order-card" data-order-card data-search="{{ number|lower }} {{ customer|lower }} {{ phone|cut:' ' }}" data-fulfillment="{{ fulfillment_key }}" data-payment="{{ payment_key }}" data-order="{{ order_key }}" data-priority="{{ priority_key }}" data-tag="{{ tag_key }}"><header><div><a href="{% url 'dashboard:order_detail' number %}"><strong>{{ short }}</strong></a><span>16 Jul 2026</span></div>{% if priority %}<span class="priority-badge{% if priority == 'High' %} priority-badge--high{% endif %}">{{ priority }}</span>{% endif %}</header><h3>{{ customer }}</h3><a href="tel:{{ phone|cut:' ' }}">{{ phone }}</a><dl><div><dt>Total</dt><dd>{{ total }}</dd></div><div><dt>Fulfillment</dt><dd>{{ method }}</dd></div><div><dt>Order</dt><dd>{{ order_status }}</dd></div><div><dt>Payment</dt><dd>{{ payment_status }}</dd></div><div><dt>Estimated completion</dt><dd>{{ estimate }}</dd></div><div><dt>Last updated</dt><dd>3:10 pm</dd></div></dl><a class="staff-button staff-button--secondary" href="{% url 'dashboard:order_detail' number %}">Open order</a></article>
