<form class="tracking-form" data-tracking-form novalidate><div class="tracking-form__fields"><label><span>Order number</span><input name="order_number" autocomplete="off" autocapitalize="characters" required placeholder="WTF-260716-1042" value="{% if state_mode == 'success' %}WTF-260716-1042{% endif %}" aria-describedby="tracking-order-error"><small id="tracking-order-error" data-tracking-field-error></small></label><label><span>Phone number</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+254 724 853 914" value="{% if state_mode == 'success' %}+254 724 853 914{% endif %}" aria-describedby="tracking-phone-hint tracking-phone-error"><small id="tracking-phone-hint">Use the number entered at checkout.</small><small id="tracking-phone-error" data-tracking-field-error></small></label><button class="btn btn--primary" type="submit">Track Order</button></div><div class="tracking-form__error" data-tracking-validation role="alert" tabindex="-1" hidden>Please enter both the order number and a valid Kenyan phone number.</div></form>
